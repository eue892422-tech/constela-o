<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Constelação</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000814;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

body{
  background:
  radial-gradient(circle at top, rgba(40,90,255,.12), transparent 40%),
  radial-gradient(circle at right, rgba(255,120,220,.08), transparent 35%),
  radial-gradient(circle at left bottom, rgba(120,255,255,.06), transparent 35%),
  #000814;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
/* =========================================
CANVAS
========================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

/* =========================================
CONFIG
========================================= */

const CONFIG = {

  image: "foto.jpg",

  /*
  menos partículas = mais leve
  */

  particleGap: 7,

  /*
  aumenta se quiser mais detalhe
  */

  maxParticles: 1100,

  /*
  velocidade da formação
  */

  speed: 0.022,

  friction: 0.90,

  /*
  fundo
  */

  stars: 170,

  /*
  conexões
  */

  connectDistance: 20
};

/* =========================================
FUNDO
========================================= */

const bgStars = [];

for(let i=0;i<CONFIG.stars;i++){

  bgStars.push({

    x: Math.random()*W,
    y: Math.random()*H,

    size: Math.random()*2,

    alpha: Math.random(),

    speed: Math.random()*0.4 + 0.1
  });
}

function drawBackground(){

  ctx.fillStyle = "#000814";
  ctx.fillRect(0,0,W,H);

  for(const s of bgStars){

    s.y += s.speed;

    if(s.y > H){

      s.y = -5;
      s.x = Math.random()*W;
    }

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
    `rgba(255,255,255,${s.alpha})`;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "#fff";

    ctx.fill();
  }
}

/* =========================================
METEOROS
========================================= */

const meteors = [];

function createMeteor(){

  meteors.push({

    x: Math.random()*W,
    y: Math.random()*H*0.3,

    vx: -12,
    vy: 6,

    alpha: 1
  });
}

setInterval(()=>{

  if(Math.random() > .5){

    createMeteor();
  }

},2200);

function drawMeteors(){

  for(let i=meteors.length-1;i>=0;i--){

    const m = meteors[i];

    m.x += m.vx;
    m.y += m.vy;

    m.alpha -= 0.01;

    ctx.beginPath();

    ctx.moveTo(m.x,m.y);

    ctx.lineTo(
      m.x + 100,
      m.y - 50
    );

    ctx.strokeStyle =
    `rgba(255,255,255,${m.alpha})`;

    ctx.lineWidth = 1.5;

    ctx.shadowBlur = 10;
    ctx.shadowColor = "#fff";

    ctx.stroke();

    if(m.alpha <= 0){

      meteors.splice(i,1);
    }
  }
}

/* =========================================
PARTÍCULAS
========================================= */

const particles = [];

class Particle{

  constructor(tx,ty,color){

    this.tx = tx;
    this.ty = ty;

    /*
    começam espalhadas
    */

    this.x = Math.random()*W;
    this.y = Math.random()*H;

    this.vx = 0;
    this.vy = 0;

    this.color = color;

    this.size =
      Math.random()*1.7 + 0.4;

    this.alpha = 0;

    /*
    delay cria formação gradual
    */

    this.delay =
      Math.random()*120;
  }

  update(){

    if(this.delay > 0){

      this.delay--;
      return;
    }

    const dx = this.tx - this.x;
    const dy = this.ty - this.y;

    this.vx += dx * CONFIG.speed;
    this.vy += dy * CONFIG.speed;

    this.vx *= CONFIG.friction;
    this.vy *= CONFIG.friction;

    this.x += this.vx;
    this.y += this.vy;

    if(this.alpha < 1){

      this.alpha += 0.02;
    }
  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
    `rgba(${this.color.r},
           ${this.color.g},
           ${this.color.b},
           ${this.alpha})`;

    ctx.shadowBlur = 12;

    ctx.shadowColor =
    `rgb(${this.color.r},
         ${this.color.g},
         ${this.color.b})`;

    ctx.fill();
  }
}

/* =========================================
CRIAR IMAGEM
========================================= */

function createFace(img){

  particles.length = 0;

  const off =
    document.createElement("canvas");

  const octx =
    off.getContext("2d");

  /*
  tamanho da imagem
  */

  const scale = Math.min(
    W*0.42 / img.width,
    H*0.75 / img.height
  );

  const iw = img.width * scale;
  const ih = img.height * scale;

  off.width = iw;
  off.height = ih;

  octx.drawImage(
    img,
    0,
    0,
    iw,
    ih
  );

  const data =
    octx.getImageData(
      0,
      0,
      iw,
      ih
    ).data;

  const offsetX =
    W/2 - iw/2;

  const offsetY =
    H/2 - ih/2;

  /*
  percorre pixels
  */

  for(
    let y=0;
    y<ih;
    y+=CONFIG.particleGap
  ){

    for(
      let x=0;
      x<iw;
      x+=CONFIG.particleGap
    ){

      const i =
      (y*iw + x) * 4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];

      if(a < 100){
        continue;
      }

      /*
      brilho
      */

      const brightness =
      (r+g+b)/3;

      /*
      ignora partes muito escuras
      */

      if(brightness < 35){
        continue;
      }

      /*
      remove fundos muito vermelhos
      */

      if(
        r > g + 40 &&
        r > b + 40 &&
        brightness < 170
      ){
        continue;
      }

      /*
      cria partícula
      */

      particles.push(

        new Particle(

          x + offsetX,
          y + offsetY,

          {r,g,b}
        )
      );

      /*
      limite
      */

      if(
        particles.length >=
        CONFIG.maxParticles
      ){
        return;
      }
    }
  }
}

/* =========================================
CONEXÕES
========================================= */

function connectParticles(){

  for(let i=0;i<particles.length;i++){

    const a = particles[i];

    for(let j=i+1;j<particles.length;j++){

      const b = particles[j];

      const dx = a.x - b.x;
      const dy = a.y - b.y;

      const d =
      Math.sqrt(dx*dx + dy*dy);

      if(d < CONFIG.connectDistance){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle =
        `rgba(255,255,255,${
          (1-d/CONFIG.connectDistance)*0.08
        })`;

        ctx.lineWidth = 0.4;

        ctx.stroke();
      }
    }
  }
}

/* =========================================
ANIMAÇÃO
========================================= */

function animate(){

  requestAnimationFrame(animate);

  drawBackground();

  drawMeteors();

  for(const p of particles){

    p.update();
    p.draw();
  }

  connectParticles();
}

/* =========================================
LOAD DA FOTO
========================================= */

const img = new Image();

img.src = CONFIG.image;

img.onload = ()=>{

  createFace(img);

  animate();
};

img.onerror = ()=>{

  alert(
    "foto.jpg não encontrada"
  );
};

/* =========================================
RESIZE
========================================= */

addEventListener("resize",()=>{

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
});
</script>

</body>
</html>
