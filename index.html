<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retrato Constelação</title>
  <style>
    :root {
      --bg1: #050814;
      --bg2: #08111f;
      --line: rgba(235, 240, 255, 0.72);
      --line-soft: rgba(235, 240, 255, 0.34);
      --star: rgba(255, 255, 255, 0.98);
      --glow: rgba(201, 224, 255, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, #0a1224 0%, #050814 45%, #02040a 100%);
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    canvas {
      width: min(100vw - 32px, 1024px);
      height: auto;
      aspect-ratio: 4 / 3;
      display: block;
      border-radius: 14px;
      box-shadow:
        0 0 40px rgba(160, 200, 255, 0.06),
        0 20px 80px rgba(0, 0, 0, 0.45);
      background:
        radial-gradient(circle at 50% 15%, rgba(20, 30, 60, 0.35), transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(8, 14, 24, 0.5), transparent 70%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.68);
      font-size: 13px;
      letter-spacing: .02em;
      background: rgba(5, 8, 20, 0.55);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
      padding: 8px 12px;
      border-radius: 999px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="scene" width="1024" height="768"></canvas>
  </div>
  <div class="hint">Clique para um novo céu • retrato em constelação procedural</div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const DPR = Math.max(1, window.devicePixelRatio || 1);

    // =========================================================
    // CONFIGURAÇÃO GERAL
    // =========================================================
    const CFG = {
      backgroundStars: 380,
      mistLayers: 2,
      lineWidth: 1.05,
      lineGlow: 7,
      starMin: 0.7,
      starMax: 2.8,
      portraitStarMin: 1.6,
      portraitStarMax: 3.8,
      twinkleSpeed: 0.0016,
      noiseLinksPerPoint: 2,
      portraitAlpha: 0.95
    };

    // =========================================================
    // UTILITÁRIOS
    // =========================================================
    const TAU = Math.PI * 2;

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function mapPoint(p) {
      return { x: p.x * W, y: p.y * H };
    }

    function jitterPoint(p, amount = 0) {
      return {
        x: p.x + rand(-amount, amount),
        y: p.y + rand(-amount, amount)
      };
    }

    function drawGlowStar(x, y, r, alpha = 1) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5.5);
      g.addColorStop(0, `rgba(255,255,255,${0.98 * alpha})`);
      g.addColorStop(0.15, `rgba(225,235,255,${0.85 * alpha})`);
      g.addColorStop(0.35, `rgba(180,205,255,${0.28 * alpha})`);
      g.addColorStop(1, `rgba(180,205,255,0)`);

      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(x, y, r * 5.5, 0, TAU);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }

    function drawLine(a, b, alpha = 0.6, width = CFG.lineWidth) {
      ctx.save();
      ctx.strokeStyle = `rgba(236,242,255,${alpha})`;
      ctx.lineWidth = width;
      ctx.shadowBlur = CFG.lineGlow;
      ctx.shadowColor = `rgba(201,224,255,${alpha * 0.55})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawPolyline(points, closed = false, alpha = 0.56, width = CFG.lineWidth) {
      for (let i = 0; i < points.length - 1; i++) {
        drawLine(points[i], points[i + 1], alpha, width);
      }
      if (closed && points.length > 2) {
        drawLine(points[points.length - 1], points[0], alpha, width);
      }
    }

    function connectNearby(points, maxDist, alpha = 0.14, width = 0.65, limitPerPoint = 2) {
      const counts = new Array(points.length).fill(0);

      for (let i = 0; i < points.length; i++) {
        let localCandidates = [];
        for (let j = i + 1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const d = Math.hypot(dx, dy);
          if (d <= maxDist) localCandidates.push({ j, d });
        }

        localCandidates.sort((a, b) => a.d - b.d);

        for (const c of localCandidates) {
          if (counts[i] >= limitPerPoint) break;
          if (counts[c.j] >= limitPerPoint) continue;
          drawLine(points[i], points[c.j], alpha, width);
          counts[i]++;
          counts[c.j]++;
        }
      }
    }

    function mirrorX(points, xCenter) {
      return points.map(p => ({ x: xCenter + (xCenter - p.x), y: p.y }));
    }

    function sampleCurve(points, steps = 0) {
      if (!steps || points.length < 2) return points;
      const out = [];
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        out.push(a);
        for (let s = 1; s <= steps; s++) {
          out.push({
            x: lerp(a.x, b.x, s / (steps + 1)),
            y: lerp(a.y, b.y, s / (steps + 1))
          });
        }
      }
      out.push(points[points.length - 1]);
      return out;
    }

    // =========================================================

        { x: 0.485, y: 0.521 }

      // Boca
      const lipUpper = [

      // Colar
      const necklaceArc = [

      const hairL2 = [

      // Cabelo direito

      // Agrupar tudo
      const paths = [

        eyeRightUpper, eyeRightLower, irisRight, lidRight, browRight,

      const mappedPaths = paths.map(path => sampleCurve(path.map(mapPoint), 1));

      // Pontos extras para conexões naturais no cabelo e rosto
      const anchors = [
        ...mappedPaths.flat(),
        mapPoint({ x: 0.355, y: 0.220 }),

    // =========================================================
    // FUNDO ESTRELADO
    // =========================================================
    function createBackgroundStars() {
      const stars = [];
      for (let i = 0; i < CFG.backgroundStars; i++) {
        const zoneBias = Math.random();
        let x = rand(0, W);
        let y = rand(0, H);

        // Leve concentração próxima do retrato
        if (zoneBias < 0.42) {
          x = clamp(rand(W * 0.18, W * 0.82), 0, W);
          y = clamp(rand(H * 0.04, H * 0.96), 0, H);
        }

        stars.push({
          x,
          y,
          r: rand(CFG.starMin, CFG.starMax),
          a: rand(0.25, 0.95),
          phase: rand(0, Math.PI * 2),
          speed: rand(0.6, 1.45)
        });
      }
      return stars;
    }

    function drawBackground(stars, time) {
      ctx.clearRect(0, 0, W
