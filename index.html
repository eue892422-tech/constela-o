<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Constelação</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020812;
}

canvas{
  display:block;
}

body{
  background:
  radial-gradient(circle at 20% 20%, rgba(80,120,255,.08), transparent 30%),
  radial-gradient(circle at 80% 30%, rgba(255,120,220,.06), transparent 30%),
  radial-gradient(circle at 50% 80%, rgba(120,255,220,.04), transparent 35%),
  #020812;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

/* =========================================
CONFIG
========================================= */

const CONFIG = {

  imageUrl: "foto.jpg",

  particleGap: 6,

  maxParticles: 1800,

  starCount: 220,

  formationSpeed: 0.045,

  friction: 0.90,

  connectDistance: 22
};

/* =========================================
UTILS
========================================= */

function rand(min,max){
  return Math.random()*(max-min)+min;
}

/* =========================================
FUNDO
========================================= */

const bgStars = [];

for(let i=0;i<CONFIG.starCount;i++){

  bgStars.push({
    x: rand(0,W),
    y: rand(0,H),
    r: rand(.3,2),
    a: rand(.2,1),
    s: rand(.2,1)
  });

}

function drawBackground(){

  const g = ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#04101f");
  g.addColorStop(.5,"#020812");
  g.addColorStop(1,"#01040a");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(const s of bgStars){

    s.y += s.s;

    if(s.y > H){
      s.y = -10;
      s.x = rand(0,W);
    }

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

    ctx.fillStyle = `rgba(255,255,255,${s.a})`;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "#fff";

    ctx.fill();
  }
}

/* =========================================
ESTRELAS CADENTES
========================================= */

const meteors = [];

function createMeteor(){

  meteors.push({

    x: rand(W*.2,W*.9),
    y: rand(-50,H*.3),

    vx: -12,
    vy: 6,

    life: 1
  });

}

setInterval(()=>{

  if(Math.random()>.4){
    createMeteor();
  }

},2000);

function drawMeteors(){

  for(let i=meteors.length-1;i>=0;i--){

    const m = meteors[i];

    m.x += m.vx;
    m.y += m.vy;

    m.life -= .01;

    ctx.beginPath();

    ctx.moveTo(m.x,m.y);

    ctx.lineTo(
      m.x + 120,
      m.y - 60
    );

    ctx.strokeStyle =
      `rgba(255,255,255,${m.life})`;

    ctx.lineWidth = 1.5;

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#fff";

    ctx.stroke();

    if(m.life<=0){
      meteors.splice(i,1);
    }
  }
}

/* =========================================
PARTÍCULAS
========================================= */

const particles = [];

class Particle{

  constructor(tx,ty,color){

    this.tx = tx;
    this.ty = ty;

    this.x = rand(0,W);
    this.y = rand(-H,H);

    this.vx = 0;
    this.vy = 0;

    this.color = color;

    this.size = rand(.6,1.8);

    this.alpha = 0;

    this.delay = rand(0,120);
  }

  update(){

    if(this.delay>0){
      this.delay--;
      return;
    }

    const dx = this.tx - this.x;
    const dy = this.ty - this.y;

    this.vx += dx * CONFIG.formationSpeed;
    this.vy += dy * CONFIG.formationSpeed;

    this.vx *= CONFIG.friction;
    this.vy *= CONFIG.friction;

    this.x += this.vx;
    this.y += this.vy;

    this.alpha += .02;

    if(this.alpha > 1){
      this.alpha = 1;
    }
  }

  draw(){

    ctx.beginPath();

    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

    ctx.fillStyle =
    `rgba(${this.color.r},
           ${this.color.g},
           ${this.color.b},
           ${this.alpha})`;

    ctx.shadowBlur = 12;

    ctx.shadowColor =
    `rgb(${this.color.r},
         ${this.color.g},
         ${this.color.b})`;

    ctx.fill();
  }

}

/* =========================================
CRIAR ROSTO
========================================= */

function createFaceParticles(img){

  particles.length = 0;

  const off = document.createElement("canvas");
  const octx = off.getContext("2d");

  const scale = Math.min(
    W*.5 / img.width,
    H*.7 / img.height
  );

  const iw = img.width * scale;
  const ih = img.height * scale;

  off.width = iw;
  off.height = ih;

  octx.drawImage(img,0,0,iw,ih);

  const data =
    octx.getImageData(0,0,iw,ih).data;

  const offsetX = W/2 - iw/2;
  const offsetY = H/2 - ih/2;

  for(let y=0;y<ih;y+=CONFIG.particleGap){

    for(let x=0;x<iw;x+=CONFIG.particleGap){

      const i = (y*iw + x)*4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];

      if(a < 100) continue;

      const brightness = (r+g+b)/3;

      /*
      IGNORA FUNDO
      */

      if(brightness < 35) continue;

      /*
      REMOVE ÁREAS MUITO AZUIS/PRETAS
      */

      if(
        b > r+35 &&
        b > g+35
      ){
        continue;
      }

      /*
      REMOVE FUNDO CINZA
      */

      if(
        Math.abs(r-g)<12 &&
        Math.abs(g-b)<12 &&
        brightness > 120
      ){
        continue;
      }

      particles.push(
        new Particle(
          x+offsetX,
          y+offsetY,
          {r,g,b}
        )
      );

      if(
        particles.length >
        CONFIG.maxParticles
      ){
        return;
      }

    }
  }
}

/* =========================================
CONEXÕES
========================================= */

function connectParticles(){

  for(let i=0;i<particles.length;i++){

    const a = particles[i];

    for(let j=i+1;j<particles.length;j++){

      const b = particles[j];

      const dx = a.x-b.x;
      const dy = a.y-b.y;

      const d = Math.sqrt(dx*dx+dy*dy);

      if(d < CONFIG.connectDistance){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle =
        `rgba(255,255,255,${
          (1-d/CONFIG.connectDistance)*.08
        })`;

        ctx.lineWidth = .4;

        ctx.stroke();
      }
    }
  }
}

/* =========================================
ANIMAÇÃO
========================================= */

function animate(){

  requestAnimationFrame(animate);

  drawBackground();

  drawMeteors();

  for(const p of particles){

    p.update();
    p.draw();

  }

  connectParticles();
}

/* =========================================
LOAD FOTO
========================================= */

const img = new Image();

img.src = CONFIG.imageUrl;

img.onload = ()=>{

  createFaceParticles(img);

  animate();

};

/* =========================================
RESPONSIVO
========================================= */

addEventListener("resize",()=>{

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;

});
</script>

</body>
</html>
