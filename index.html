<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Constelação Viva</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#020612;
        height:100vh;
        font-family:Arial, sans-serif;
    }

    canvas{
        display:block;
    }

    .title{
        position:absolute;
        top:20px;
        width:100%;
        text-align:center;
        color:white;
        letter-spacing:4px;
        font-size:14px;
        opacity:0.7;
        z-index:10;
    }
</style>
</head>
<body>

<div class="title">
    CONSTELAÇÃO VIVA
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    createFace();
});

const stars = [];
const backgroundStars = [];

class Star {
    constructor(x, y, size = 2, target = false){
        this.x = Math.random() * w;
        this.y = Math.random() * h;

        this.tx = x;
        this.ty = y;

        this.size = size;
        this.target = target;

        this.speed = Math.random() * 0.02 + 0.01;

        this.opacity = Math.random();
        this.twinkle = Math.random() * 0.05;
    }

    update(){
        this.x += (this.tx - this.x) * this.speed;
        this.y += (this.ty - this.y) * this.speed;

        this.opacity += this.twinkle;

        if(this.opacity > 1 || this.opacity < 0.2){
            this.twinkle *= -1;
        }
    }

    draw(){
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 10;
        ctx.shadowColor = "white";
    }
}

function addCurve(points, amount = 10){
    const generated = [];

    for(let i = 0; i < points.length - 1; i++){
        const p1 = points[i];
        const p2 = points[i + 1];

        for(let j = 0; j < amount; j++){
            const t = j / amount;

            generated.push({
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            });
        }
    }

    return generated;
}

function createFace(){

    stars.length = 0;

    const cx = w / 2;
    const cy = h / 2;

    const scale = Math.min(w, h) / 900;

    const face = [

        // cabelo esquerdo
        ...addCurve([
            {x: cx - 250*scale, y: cy - 250*scale},
            {x: cx - 300*scale, y: cy - 50*scale},
            {x: cx - 260*scale, y: cy + 260*scale},
        ], 25),

        // cabelo direito
        ...addCurve([
            {x: cx + 250*scale, y: cy - 250*scale},
            {x: cx + 310*scale, y: cy + 10*scale},
            {x: cx + 250*scale, y: cy + 260*scale},
        ], 25),

        // topo cabelo
        ...addCurve([
            {x: cx - 250*scale, y: cy - 250*scale},
            {x: cx, y: cy - 340*scale},
            {x: cx + 250*scale, y: cy - 250*scale},
        ], 30),

        // rosto
        ...addCurve([
            {x: cx - 120*scale, y: cy - 140*scale},
            {x: cx - 170*scale, y: cy + 60*scale},
            {x: cx - 80*scale, y: cy + 220*scale},
            {x: cx, y: cy + 260*scale},
            {x: cx + 80*scale, y: cy + 220*scale},
            {x: cx + 170*scale, y: cy + 60*scale},
            {x: cx + 120*scale, y: cy - 140*scale},
        ], 20),

        // olho esquerdo
        ...addCurve([
            {x: cx - 90*scale, y: cy - 30*scale},
            {x: cx - 45*scale, y: cy - 50*scale},
            {x: cx - 10*scale, y: cy - 30*scale},
            {x: cx - 45*scale, y: cy - 10*scale},
            {x: cx - 90*scale, y: cy - 30*scale},
        ], 10),

        // olho direito
        ...addCurve([
            {x: cx + 10*scale, y: cy - 30*scale},
            {x: cx + 45*scale, y: cy - 50*scale},
            {x: cx + 90*scale, y: cy - 30*scale},
            {x: cx + 45*scale, y: cy - 10*scale},
            {x: cx + 10*scale, y: cy - 30*scale},
        ], 10),

        // nariz
        ...addCurve([
            {x: cx, y: cy - 10*scale},
            {x: cx - 10*scale, y: cy + 60*scale},
            {x: cx + 10*scale, y: cy + 90*scale},
        ], 15),

        // boca
        ...addCurve([
            {x: cx - 60*scale, y: cy + 130*scale},
            {x: cx, y: cy + 150*scale},
            {x: cx + 60*scale, y: cy + 130*scale},
        ], 20),

        // cabelo interno
        ...addCurve([
            {x: cx - 40*scale, y: cy - 250*scale},
            {x: cx - 90*scale, y: cy - 80*scale},
            {x: cx - 120*scale, y: cy + 50*scale},
        ], 20),

        ...addCurve([
            {x: cx + 40*scale, y: cy - 250*scale},
            {x: cx + 90*scale, y: cy - 80*scale},
            {x: cx + 120*scale, y: cy + 50*scale},
        ], 20),
    ];

    face.forEach(p => {
        stars.push(new Star(
            p.x,
            p.y,
            Math.random() * 2 + 1,
            true
        ));
    });
}

function createBackgroundStars(){
    for(let i = 0; i < 400; i++){
        backgroundStars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 2,
            opacity: Math.random()
        });
    }
}

function drawBackground(){
    backgroundStars.forEach(s => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawConnections(){

    for(let i = 0; i < stars.length; i++){

        for(let j = i + 1; j < stars.length; j++){

            const a = stars[i];
            const b = stars[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 35){

                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,255,255,${0.15 - dist/300})`;
                ctx.lineWidth = 1;

                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.stroke();
            }
        }
    }
}

function animate(){

    ctx.clearRect(0,0,w,h);

    drawBackground();

    drawConnections();

    stars.forEach(star => {
        star.update();
        star.draw();
    });

    requestAnimationFrame(animate);
}

createBackgroundStars();
createFace();
animate();

document.addEventListener("mousemove", e => {

    stars.forEach(star => {

        const dx = e.clientX - star.x;
        const dy = e.clientY - star.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 120){

            star.x -= dx * 0.01;
            star.y -= dy * 0.01;
        }
    });

});
</script>

</body>
</html>
