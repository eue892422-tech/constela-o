<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Constelação Cinematográfica</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

body{
  background:
  radial-gradient(circle at center,#07111f 0%,#02050c 50%,#000 100%);
}

canvas{
  display:block;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

/*
========================================
CANVAS
========================================
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

/*
========================================
CONFIG
========================================
*/

const CONFIG = {

  imageUrl:"foto.jpg",

  /*
  MAIS RÁPIDO
  */

  pixelStep:7,

  /*
  MENOS PARTÍCULAS
  MAIS FPS
  */

  maxParticles:850,

  /*
  FORMA MAIS RÁPIDA
  */

  spring:0.13,
  friction:0.82,

  /*
  COMEÇAR PERTO
  */

  spawnRadius:160,

  /*
  CONEXÕES
  */

  connectDistance:8,

  /*
  FUNDO
  */

  stars:180,
  movingStars:45,

};

/*
========================================
UTILS
========================================
*/

function rand(min,max){
  return Math.random()*(max-min)+min;
}

/*
========================================
FUNDO ESTRELAS
========================================
*/

const bgStars = [];

for(let i=0;i<CONFIG.stars;i++){

  bgStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.4,1.8),

    alpha:rand(0.2,1)

  });

}

/*
========================================
ESTRELAS VIVAS
========================================
*/

const movingStars = [];

for(let i=0;i<CONFIG.movingStars;i++){

  movingStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.8,2),

    vx:rand(-0.02,0.02),

    vy:rand(0.03,0.12),

    glow:rand(4,12),

    pulse:rand(0,Math.PI*2)

  });

}

/*
========================================
NEBULOSAS
========================================
*/

const nebulas = [];

for(let i=0;i<4;i++){

  nebulas.push({

    x:rand(0,W),
    y:rand(0,H),

    radius:rand(180,320),

    color:[
      "120,140,255",
      "255,120,220",
      "120,255,220"
    ][Math.floor(Math.random()*3)],

    alpha:rand(0.03,0.08)

  });

}

/*
========================================
PLANETAS
========================================
*/

const planets = [];

for(let i=0;i<3;i++){

  planets.push({

    x:rand(100,W-100),
    y:rand(80,H*0.5),

    radius:rand(10,24),

    glow:rand(20,40),

    color:[
      "#7aa8ff",
      "#ff8edf",
      "#98ffe0"
    ][Math.floor(Math.random()*3)]

  });

}

/*
========================================
PARTÍCULAS
========================================
*/

const particles = [];

class Particle{

  constructor(x,y,tx,ty,color){

    this.x=x;
    this.y=y;

    this.tx=tx;
    this.ty=ty;

    this.vx=rand(-1,1);
    this.vy=rand(-1,1);

    this.size=rand(0.5,1.6);

    this.alpha=0;

    this.targetAlpha=rand(0.7,1);

    this.color=color;

  }

  update(){

    let dx=this.tx-this.x;
    let dy=this.ty-this.y;

    /*
    MAIS RÁPIDO
    */

    this.vx += dx * CONFIG.spring;
    this.vy += dy * CONFIG.spring;

    this.vx *= CONFIG.friction;
    this.vy *= CONFIG.friction;

    this.x += this.vx;
    this.y += this.vy;

    this.alpha +=
      (this.targetAlpha-this.alpha)*0.08;

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        ${this.alpha}
      )`;

    ctx.shadowBlur=12;

    ctx.shadowColor=
      `rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        1
      )`;

    ctx.fill();

  }

}

/*
========================================
CRIAR PARTÍCULAS
========================================
*/

const img = new Image();

img.src = CONFIG.imageUrl;

img.onload = ()=>{

  const off=document.createElement("canvas");
  const offCtx=off.getContext("2d");

  /*
  TAMANHO MENOR
  MAIS LEVE
  */

  const scale = Math.min(

    (W*0.45)/img.width,
    (H*0.65)/img.height

  );

  off.width = img.width*scale;
  off.height = img.height*scale;

  offCtx.drawImage(
    img,
    0,
    0,
    off.width,
    off.height
  );

  const data = offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  const offsetX =
    W/2 - off.width/2;

  const offsetY =
    H/2 - off.height/2;

  let created = 0;

  /*
  MUITO MAIS LEVE
  */

  for(let y=0;y<off.height;y+=CONFIG.pixelStep){

    for(let x=0;x<off.width;x+=CONFIG.pixelStep){

      const i =
        (y*off.width+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];
      const a=data[i+3];

      const brightness =
        (r+g+b)/3;

      /*
      DETECÇÃO MELHOR
      */

      if(a>40 && brightness>25){

        const tx=x+offsetX;
        const ty=y+offsetY;

        /*
        COMEÇAR PERTO
        */

        const angle=
          Math.random()*Math.PI*2;

        const radius=
          Math.random()*CONFIG.spawnRadius;

        const startX=
          tx+Math.cos(angle)*radius;

        const startY=
          ty+Math.sin(angle)*radius;

        particles.push(

          new Particle(

            startX,
            startY,

            tx,
            ty,

            {r,g,b}

          )

        );

        created++;

        /*
        LIMITAR
        */

        if(created>=CONFIG.maxParticles){

          break;

        }

      }

    }

    if(created>=CONFIG.maxParticles){

      break;

    }

  }

};

/*
========================================
FUNDO
========================================
*/

function drawBackground(){

  /*
  NEBULOSAS
  */

  for(let n of nebulas){

    const grad =
      ctx.createRadialGradient(

        n.x,
        n.y,
        0,

        n.x,
        n.y,
        n.radius

      );

    grad.addColorStop(
      0,
      `rgba(${n.color},${n.alpha})`
    );

    grad.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=grad;

    ctx.beginPath();

    ctx.arc(
      n.x,
      n.y,
      n.radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
  ESTRELAS FIXAS
  */

  for(let s of bgStars){

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${s.alpha})`;

    ctx.fill();

  }

  /*
  PLANETAS
  */

  for(let p of planets){

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle=p.color;

    ctx.shadowBlur=p.glow;
    ctx.shadowColor=p.color;

    ctx.fill();

  }

}

/*
========================================
ESTRELAS MOVENDO
========================================
*/

function drawMovingStars(time){

  for(let s of movingStars){

    s.x += s.vx;
    s.y += s.vy;

    if(s.y>H){

      s.y=-10;
      s.x=rand(0,W);

    }

    const pulse =
      0.7+
      Math.sin(
        time*0.002+s.pulse
      )*0.3;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${pulse})`;

    ctx.shadowBlur=s.glow;
    ctx.shadowColor="white";

    ctx.fill();

  }

}

/*
========================================
CONEXÕES
========================================
*/

function connectParticles(){

  const maxDist =
    CONFIG.connectDistance;

  const maxDistSq =
    maxDist*maxDist;

  /*
  OTIMIZADO
  */

  for(let i=0;i<particles.length;i++){

    const a=particles[i];

    for(let j=i+1;j<i+10 && j<particles.length;j++){

      const b=particles[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;

      const d2=dx*dx+dy*dy;

      if(d2<maxDistSq){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle=
          "rgba(255,255,255,0.08)";

        ctx.lineWidth=0.4;

        ctx.stroke();

      }

    }

  }

}

/*
========================================
ANIMAÇÃO
========================================
*/

function animate(time=0){

  requestAnimationFrame(animate);

  /*
  RASTRO SUAVE
  */

  ctx.fillStyle=
    "rgba(0,0,0,0.22)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawMovingStars(time);

  /*
  PARTÍCULAS
  */

  ctx.save();

  ctx.globalCompositeOperation=
    "screen";

  for(let p of particles){

    p.update();
    p.draw();

  }

  ctx.restore();

  connectParticles();

}

animate();

/*
========================================
RESPONSIVO
========================================
*/

addEventListener("resize",()=>{

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

});

</script>

</body>
</html>
