<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Constelação Retrato</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  background:
    radial-gradient(circle at top, #08152b 0%, #020611 45%, #01040a 100%);
}

.info{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.7);
  font-family:Arial;
  font-size:14px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.08);
  padding:10px 16px;
  border-radius:999px;
  backdrop-filter:blur(10px);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="info">
✨ As estrelas revelam o retrato
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const stars = [];
const transitionStars = [];

const portrait = new Image();
portrait.src = "portrait.png";

let imageLoaded = false;

portrait.onload = () => {
  imageLoaded = true;
};

function rand(min,max){
  return Math.random()*(max-min)+min;
}

function createBackgroundStars(){

  stars.length = 0;

  for(let i=0;i<180;i++){

    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*2 + 0.3,
      alpha:Math.random()*0.8 + 0.2,
      phase:Math.random()*Math.PI*2
    });
  }
}

function createTransitionStars(){

  transitionStars.length = 0;

  for(let i=0;i<280;i++){

    transitionStars.push({

      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,

      size:rand(1,4),
      alpha:1,

      vx:rand(-1.5,1.5),
      vy:rand(-1.5,1.5)
    });
  }
}

createBackgroundStars();
createTransitionStars();

function glowStar(x,y,r,a){

  const g = ctx.createRadialGradient(x,y,0,x,y,r*6);

  g.addColorStop(0,`rgba(255,255,255,${a})`);
  g.addColorStop(.2,`rgba(210,225,255,${a*.9})`);
  g.addColorStop(.45,`rgba(130,170,255,${a*.3})`);
  g.addColorStop(1,"rgba(130,170,255,0)");

  ctx.beginPath();
  ctx.fillStyle = g;
  ctx.arc(x,y,r*6,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

let portraitAlpha = 0;
let transitionAlpha = 1;

function drawBackground(time){

  for(const s of stars){

    const twinkle =
      0.7 + Math.sin(time*0.001 + s.phase)*0.3;

    glowStar(
      s.x,
      s.y,
      s.r*twinkle,
      s.alpha
    );
  }
}

function drawTransitionStars(){

  for(const s of transitionStars){

    s.x += s.vx;
    s.y += s.vy;

    s.alpha -= 0.0035;

    glowStar(
      s.x,
      s.y,
      s.size,
      s.alpha
    );
  }

  if(transitionAlpha > 0){
    transitionAlpha -= 0.003;
  }
}

function drawPortrait(){

  if(!imageLoaded) return;

  if(portraitAlpha < 1){
    portraitAlpha += 0.004;
  }

  const ratio = portrait.width / portrait.height;

  let w = canvas.width * 0.72;
  let h = w / ratio;

  if(h > canvas.height * 0.9){
    h = canvas.height * 0.9;
    w = h * ratio;
  }

  const x = canvas.width/2 - w/2;
  const y = canvas.height/2 - h/2;

  ctx.save();

  ctx.globalAlpha = portraitAlpha;

  ctx.shadowBlur = 25;
  ctx.shadowColor = "rgba(180,220,255,.35)";

  ctx.drawImage(
    portrait,
    x,
    y,
    w,
    h
  );

  ctx.restore();
}

function drawVignette(){

  const g = ctx.createRadialGradient(
    canvas.width/2,
    canvas.height/2,
    canvas.height*0.2,

    canvas.width/2,
    canvas.height/2,
    canvas.height*0.9
  );

  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(0,0,0,.55)");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function animate(time){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const bg = ctx.createLinearGradient(
    0,0,0,canvas.height
  );

  bg.addColorStop(0,"#071326");
  bg.addColorStop(.45,"#020611");
  bg.addColorStop(1,"#01040a");

  ctx.fillStyle = bg;
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground(time);

  drawPortrait();

  if(transitionAlpha > 0){
    drawTransitionStars();
  }

  drawVignette();

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
