<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Constelação</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  pointer-events:none;
  z-index:10;
}

.title{
  color:white;
  font-size:4rem;
  letter-spacing:8px;
  text-shadow:
    0 0 10px white,
    0 0 25px white,
    0 0 60px #7aa6ff;
  opacity:0;
  animation:fadeIn 3s ease forwards;
}

.sub{
  color:#ddd;
  margin-top:20px;
  font-size:1.2rem;
  opacity:0;
  animation:fadeIn 3s ease forwards;
  animation-delay:2s;
  text-shadow:0 0 15px white;
}

@keyframes fadeIn{
  to{
    opacity:1;
  }
}

</style>
</head>
<body>

<div class="overlay">
  <div class="title">ELOÁ</div>
  <div class="sub">
    bilhões de estrelas... mas nenhuma brilha como você
  </div>
</div>

<script type="module">

/*
========================================
THREE JS
========================================
*/

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";

import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/postprocessing/EffectComposer.js";

import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/postprocessing/RenderPass.js";

import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/postprocessing/UnrealBloomPass.js";

/*
========================================
CENA
========================================
*/

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000,0.0009);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  2000
);

camera.position.z = 220;

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(devicePixelRatio);

document.body.appendChild(renderer.domElement);

/*
========================================
BLOOM CINEMATOGRÁFICO
========================================
*/

const composer = new EffectComposer(renderer);

composer.addPass(
  new RenderPass(scene,camera)
);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(
    window.innerWidth,
    window.innerHeight
  ),
  1.8,
  0.4,
  0.85
);

composer.addPass(bloomPass);

/*
========================================
ESTRELAS DE FUNDO
========================================
*/

const bgGeometry = new THREE.BufferGeometry();

const bgCount = 5000;

const bgPositions = [];

for(let i=0;i<bgCount;i++){

  bgPositions.push(
    (Math.random()-0.5)*3000,
    (Math.random()-0.5)*3000,
    (Math.random()-0.5)*3000
  );

}

bgGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    bgPositions,
    3
  )
);

const bgMaterial = new THREE.PointsMaterial({
  color:0xffffff,
  size:1.3,
  transparent:true,
  opacity:0.9
});

const backgroundStars = new THREE.Points(
  bgGeometry,
  bgMaterial
);

scene.add(backgroundStars);

/*
========================================
NEBULOSA
========================================
*/

const nebulaGeometry = new THREE.BufferGeometry();

const nebulaPositions = [];

for(let i=0;i<2000;i++){

  nebulaPositions.push(
    (Math.random()-0.5)*1000,
    (Math.random()-0.5)*1000,
    (Math.random()-0.5)*1000
  );

}

nebulaGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    nebulaPositions,
    3
  )
);

const nebulaMaterial = new THREE.PointsMaterial({
  color:0x7aa6ff,
  size:3,
  transparent:true,
  opacity:0.05
});

const nebula = new THREE.Points(
  nebulaGeometry,
  nebulaMaterial
);

scene.add(nebula);

/*
========================================
IMAGEM
========================================
*/

const img = new Image();

/*
========================================
MUDE O NOME DA FOTO AQUI
========================================
*/

img.src = "foto.jpg";

let faceParticles;

/*
========================================
CRIAR ROSTO
========================================
*/

img.onload = () => {

  const tempCanvas = document.createElement("canvas");
  const ctx = tempCanvas.getContext("2d");

  const scale = 0.45;

  tempCanvas.width = img.width * scale;
  tempCanvas.height = img.height * scale;

  ctx.drawImage(
    img,
    0,
    0,
    tempCanvas.width,
    tempCanvas.height
  );

  const data = ctx.getImageData(
    0,
    0,
    tempCanvas.width,
    tempCanvas.height
  ).data;

  const positions = [];
  const colors = [];

  for(let y=0;y<tempCanvas.height;y+=2){

    for(let x=0;x<tempCanvas.width;x+=2){

      const index =
        (y*tempCanvas.width+x)*4;

      const r = data[index];
      const g = data[index+1];
      const b = data[index+2];
      const a = data[index+3];

      const brightness =
        (r+g+b)/3;

      if(a > 120 && brightness > 35){

        const px =
          x - tempCanvas.width/2;

        const py =
          -y + tempCanvas.height/2;

        const pz =
          (Math.random()-0.5)*25;

        positions.push(

          (Math.random()-0.5)*2000,
          (Math.random()-0.5)*2000,
          (Math.random()-0.5)*2000

        );

        colors.push(
          r/255,
          g/255,
          b/255
        );

        positions.push(
          px*1.8,
          py*1.8,
          pz
        );

      }

    }

  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
      colors,
      3
    )
  );

  const material = new THREE.PointsMaterial({

    size:1.7,
    vertexColors:true,
    transparent:true,
    opacity:1,
    blending:THREE.AdditiveBlending

  });

  faceParticles = new THREE.Points(
    geometry,
    material
  );

  scene.add(faceParticles);

};

/*
========================================
LUZES
========================================
*/

const light1 = new THREE.PointLight(
  0xffffff,
  2
);

light1.position.set(200,200,200);

scene.add(light1);

const light2 = new THREE.PointLight(
  0x7aa6ff,
  5
);

light2.position.set(-200,-100,100);

scene.add(light2);

/*
========================================
CONTROLES
========================================
*/

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableZoom = false;
controls.enablePan = false;

/*
========================================
ANIMAÇÃO
========================================
*/

let clock = new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  backgroundStars.rotation.y += 0.0003;

  nebula.rotation.y += 0.0006;

  if(faceParticles){

    faceParticles.rotation.y =
      Math.sin(time*0.2)*0.08;

    faceParticles.rotation.x =
      Math.cos(time*0.15)*0.03;

    faceParticles.material.size =
      1.5 + Math.sin(time*2)*0.2;

  }

  camera.position.z =
    220 + Math.sin(time*0.4)*8;

  composer.render();

}

animate();

/*
========================================
RESPONSIVO
========================================
*/

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    composer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
