<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retrato Constelação</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#020816;
      font-family:Arial, Helvetica, sans-serif;
    }

    canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      background:
        radial-gradient(circle at top, #08172e 0%, #030913 45%, #01040b 100%);
    }

    .hint{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,.72);
      font-size:14px;
      background:rgba(0,0,0,.25);
      padding:10px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
      z-index:10;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hint">
  ✨ As estrelas revelam o retrato
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const W = () => canvas.width;
const H = () => canvas.height;

const stars = [];
const flyStars = [];

const bgStarsCount = 240;
const flyCount = 420;

const portrait = new Image();
portrait.src = "portrait.png";

let imageReady = false;
let reveal = 0;

portrait.onload = () => {
  imageReady = true;
};

function rand(min,max){
  return Math.random()*(max-min)+min;
}

function createBackgroundStars(){

  stars.length = 0;

  for(let i=0;i<bgStarsCount;i++){

    stars.push({
      x:Math.random()*W(),
      y:Math.random()*H(),
      r:Math.random()*2.2 + .3,
      a:Math.random()*0.8 + 0.2,
      s:Math.random()*0.4 + 0.1,
      p:Math.random()*Math.PI*2
    });
  }
}

function createFlyingStars(){

  flyStars.length = 0;

  for(let i=0;i<flyCount;i++){

    const angle = Math.random()*Math.PI*2;
    const dist = rand(300,1200);

    flyStars.push({

      x:W()/2 + Math.cos(angle)*dist,
      y:H()/2 + Math.sin(angle)*dist,

      tx:rand(W()*0.12, W()*0.88),
      ty:rand(H()*0.08, H()*0.92),

      r:rand(1,4),
      speed:rand(0.010,0.028),

      alpha:1
    });
  }
}

createBackgroundStars();
createFlyingStars();

function glowStar(x,y,r,a){

  const g = ctx.createRadialGradient(x,y,0,x,y,r*7);

  g.addColorStop(0,`rgba(255,255,255,${a})`);
  g.addColorStop(.2,`rgba(200,220,255,${a*.9})`);
  g.addColorStop(.45,`rgba(120,170,255,${a*.35})`);
  g.addColorStop(1,"rgba(120,170,255,0)");

  ctx.beginPath();
  ctx.fillStyle = g;
  ctx.arc(x,y,r*7,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function drawBackground(time){

  for(const s of stars){

    const twinkle =
      0.7 + Math.sin(time*0.001*s.s + s.p)*0.3;

    glowStar(
      s.x,
      s.y,
      s.r*twinkle,
      s.a
    );
  }
}

function drawFlyingStars(){

  for(const s of flyStars){

    s.x += (s.tx - s.x) * s.speed;
    s.y += (s.ty - s.y) * s.speed;

    if(reveal > 0.55){
      s.alpha -= 0.02;
    }

    if(s.alpha < 0){
      s.alpha = 0;
    }

    glowStar(s.x,s.y,s.r,s.alpha);
  }
}

function drawPortrait(){

  if(!imageReady) return;

  const imgRatio = portrait.width / portrait.height;

  let drawW = W()*0.72;
  let drawH = drawW / imgRatio;

  if(drawH > H()*0.88){
    drawH = H()*0.88;
    drawW = drawH * imgRatio;
  }

  const x = W()/2 - drawW/2;
  const y = H()/2 - drawH/2;

  ctx.save();

  ctx.globalAlpha = reveal;

  ctx.shadowBlur = 35;
  ctx.shadowColor = "rgba(170,210,255,.55)";

  ctx.drawImage(
    portrait,
    x,
    y,
    drawW,
    drawH
  );

  ctx.restore();
}

function vignette(){

  const g = ctx.createRadialGradient(
    W()/2,
    H()/2,
    H()*0.15,
    W()/2,
    H()/2,
    H()*0.85
  );

  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(0,0,0,.55)");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W(),H());
}

function animate(time){

  ctx.clearRect(0,0,W(),H());

  const bg = ctx.createLinearGradient(0,0,0,H());

  bg.addColorStop(0,"#07152a");
  bg.addColorStop(.45,"#020918");
  bg.addColorStop(1,"#01040a");

  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W(),H());

  drawBackground(time);

  if(reveal < 1){
    reveal += 0.0045;
  }

  drawPortrait();

  drawFlyingStars();

  vignette();

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
