<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constelação</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

body{
  background:
  radial-gradient(circle at center,#06101d 0%,#01040a 60%,#000 100%);
}

canvas{
  display:block;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

/*
========================================
CANVAS
========================================
*/

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

/*
========================================
CONFIG
========================================
*/

const CONFIG={

  imageUrl:"foto.jpg",

  /*
  MUITO MENOS PARTÍCULAS
  */

  pixelStep:11,

  maxParticles:380,

  /*
  FORMA RÁPIDO
  */

  spring:0.18,
  friction:0.80,

  /*
  ESTRELAS MAIS SEPARADAS
  */

  spawnRadius:260,

  /*
  SEM MUITAS LINHAS
  */

  connectDistance:5,

  /*
  FUNDO LEVE
  */

  bgStars:120,
  movingStars:28

};

/*
========================================
UTILS
========================================
*/

function rand(min,max){

  return Math.random()*(max-min)+min;

}

/*
========================================
FUNDO
========================================
*/

const bgStars=[];

for(let i=0;i<CONFIG.bgStars;i++){

  bgStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.5,1.8),

    alpha:rand(0.2,1)

  });

}

/*
========================================
ESTRELAS MOVENDO
========================================
*/

const movingStars=[];

for(let i=0;i<CONFIG.movingStars;i++){

  movingStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.8,2),

    vy:rand(0.05,0.18),

    glow:rand(3,10),

    pulse:rand(0,Math.PI*2)

  });

}

/*
========================================
PARTÍCULAS
========================================
*/

const particles=[];

class Particle{

  constructor(x,y,tx,ty){

    this.x=x;
    this.y=y;

    this.tx=tx;
    this.ty=ty;

    this.vx=rand(-1,1);
    this.vy=rand(-1,1);

    /*
    PEQUENAS
    */

    this.size=rand(0.6,1.4);

    this.alpha=0;

  }

  update(){

    const dx=this.tx-this.x;
    const dy=this.ty-this.y;

    /*
    FORMA MUITO RÁPIDO
    */

    this.vx+=dx*CONFIG.spring;
    this.vy+=dy*CONFIG.spring;

    this.vx*=CONFIG.friction;
    this.vy*=CONFIG.friction;

    this.x+=this.vx;
    this.y+=this.vy;

    this.alpha+=0.04;

    if(this.alpha>1){

      this.alpha=1;

    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    /*
    BRANCO MAIS SUAVE
    */

    ctx.fillStyle=
      `rgba(255,255,255,${this.alpha*0.9})`;

    ctx.shadowBlur=8;
    ctx.shadowColor="white";

    ctx.fill();

  }

}

/*
========================================
CRIAR ROSTO
========================================
*/

const img=new Image();

img.src=CONFIG.imageUrl;

img.onload=()=>{

  const off=document.createElement("canvas");
  const offCtx=off.getContext("2d");

  /*
  MENOR
  */

  const scale=Math.min(

    (W*0.38)/img.width,
    (H*0.58)/img.height

  );

  off.width=img.width*scale;
  off.height=img.height*scale;

  offCtx.drawImage(
    img,
    0,
    0,
    off.width,
    off.height
  );

  const data=offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  const offsetX=
    W/2-off.width/2;

  const offsetY=
    H/2-off.height/2;

  let created=0;

  /*
  POUCOS PONTOS
  */

  for(let y=0;y<off.height;y+=CONFIG.pixelStep){

    for(let x=0;x<off.width;x+=CONFIG.pixelStep){

      const i=
        (y*off.width+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];

      /*
      DETECÇÃO MELHOR
      */

      const brightness=
        (r+g+b)/3;

      /*
      PEGAR SÓ PARTES IMPORTANTES
      */

      if(brightness>55){

        const tx=x+offsetX;
        const ty=y+offsetY;

        /*
        COMEÇAR DO CÉU
        */

        const startX=
          tx+rand(-CONFIG.spawnRadius,CONFIG.spawnRadius);

        const startY=
          -rand(20,H);

        particles.push(

          new Particle(

            startX,
            startY,

            tx,
            ty

          )

        );

        created++;

        if(created>=CONFIG.maxParticles){

          break;

        }

      }

    }

    if(created>=CONFIG.maxParticles){

      break;

    }

  }

};

/*
========================================
ESTRELAS FUNDO
========================================
*/

function drawBackgroundStars(){

  for(let s of bgStars){

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${s.alpha})`;

    ctx.fill();

  }

}

/*
========================================
ESTRELAS MOVIMENTO
========================================
*/

function drawMovingStars(time){

  for(let s of movingStars){

    s.y+=s.vy;

    if(s.y>H){

      s.y=-10;
      s.x=rand(0,W);

    }

    const pulse=
      0.7+
      Math.sin(
        time*0.002+s.pulse
      )*0.3;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${pulse})`;

    ctx.shadowBlur=s.glow;
    ctx.shadowColor="white";

    ctx.fill();

  }

}

/*
========================================
CONEXÕES
========================================
*/

function connectParticles(){

  for(let i=0;i<particles.length;i++){

    const a=particles[i];

    /*
    SUPER OTIMIZADO
    */

    for(let j=i+1;j<i+4 && j<particles.length;j++){

      const b=particles[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;

      const dist=
        Math.sqrt(dx*dx+dy*dy);

      if(dist<CONFIG.connectDistance){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle=
          "rgba(255,255,255,0.05)";

        ctx.lineWidth=0.3;

        ctx.stroke();

      }

    }

  }

}

/*
========================================
ANIMAÇÃO
========================================
*/

function animate(time=0){

  requestAnimationFrame(animate);

  /*
  SEM BORRÃO BRANCO
  */

  ctx.fillStyle=
    "rgba(0,0,0,0.35)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  drawBackgroundStars();

  drawMovingStars(time);

  /*
  PARTÍCULAS
  */

  for(let p of particles){

    p.update();
    p.draw();

  }

  connectParticles();

}

animate();

/*
========================================
RESIZE
========================================
*/

addEventListener("resize",()=>{

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

});

</script>

</body>
</html>
