<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Constelação</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#000;
}

canvas{
  display:block;
  position:fixed;
  inset:0;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

/*
========================================
CONFIG
========================================
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const particles = [];
const stars = [];

let faceReady = false;

/*
========================================
FUNDO ESTRELADO
========================================
*/

for(let i=0;i<450;i++){

  stars.push({

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    z:Math.random()*2,
    size:Math.random()*2,
    speed:Math.random()*0.3

  });

}

/*
========================================
PARTÍCULA
========================================
*/

class Particle{

  constructor(startX,startY,targetX,targetY,color){

    this.x = startX;
    this.y = startY;

    this.tx = targetX;
    this.ty = targetY;

    this.color = color;

    this.size =
      Math.random()*1.5 + 0.3;

    this.vx = 0;
    this.vy = 0;

    this.alpha = 0;

  }

  update(){

    let dx = this.tx - this.x;
    let dy = this.ty - this.y;

    this.vx += dx * 0.010;
    this.vy += dy * 0.010;

    this.vx *= 0.88;
    this.vy *= 0.88;

    this.x += this.vx;
    this.y += this.vy;

    if(this.alpha < 1){
      this.alpha += 0.015;
    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle = `
      rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        ${this.alpha}
      )
    `;

    ctx.shadowBlur = 12;

    ctx.shadowColor = `
      rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        1
      )
    `;

    ctx.fill();

  }

}

/*
========================================
CARREGAR FOTO
========================================
*/

const image = new Image();

/*
========================================
NOME DA FOTO
========================================
*/

image.src = "foto.jpg";

image.onload = () => {

  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d");

  /*
  ========================================
  ESCALA
  ========================================
  */

  const scale = 0.45;

  off.width = image.width * scale;
  off.height = image.height * scale;

  offCtx.drawImage(
    image,
    0,
    0,
    off.width,
    off.height
  );

  const data = offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  /*
  ========================================
  MENOS PARTÍCULAS = MAIS LEVE
  ========================================
  */

  for(let y=0;y<off.height;y+=3){

    for(let x=0;x<off.width;x+=3){

      const index =
        (y*off.width + x)*4;

      const r = data[index];
      const g = data[index+1];
      const b = data[index+2];
      const a = data[index+3];

      const brightness =
        (r+g+b)/3;

      /*
      ========================================
      PEGAR SOMENTE PARTES VISÍVEIS
      ========================================
      */

      if(a > 120 && brightness > 35){

        const tx =
          x +
          canvas.width/2 -
          off.width/2;

        const ty =
          y +
          canvas.height/2 -
          off.height/2;

        /*
        ========================================
        ESTRELAS VINDO DAS BORDAS
        ========================================
        */

        let startX;
        let startY;

        const side = Math.floor(
          Math.random()*4
        );

        if(side === 0){

          startX = Math.random()*canvas.width;
          startY = -100;

        }else if(side === 1){

          startX = canvas.width+100;
          startY = Math.random()*canvas.height;

        }else if(side === 2){

          startX = Math.random()*canvas.width;
          startY = canvas.height+100;

        }else{

          startX = -100;
          startY = Math.random()*canvas.height;

        }

        particles.push(

          new Particle(

            startX,
            startY,

            tx,
            ty,

            {r,g,b}

          )

        );

      }

    }

  }

  faceReady = true;

};

/*
========================================
FUNDO
========================================
*/

function drawBackground(){

  for(let s of stars){

    s.y += s.speed;

    if(s.y > canvas.height){

      s.y = -10;
      s.x = Math.random()*canvas.width;

    }

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.8)";

    ctx.shadowBlur = 10;
    ctx.shadowColor = "white";

    ctx.fill();

  }

}

/*
========================================
LINHAS CONSTELAÇÃO
========================================
*/

function connectParticles(){

  for(let a=0;a<particles.length;a++){

    for(let b=a+1;b<particles.length;b++){

      const dx =
        particles[a].x -
        particles[b].x;

      const dy =
        particles[a].y -
        particles[b].y;

      const dist =
        Math.sqrt(dx*dx + dy*dy);

      if(dist < 11){

        ctx.beginPath();

        ctx.moveTo(
          particles[a].x,
          particles[a].y
        );

        ctx.lineTo(
          particles[b].x,
          particles[b].y
        );

        ctx.strokeStyle =
          "rgba(255,255,255,0.05)";

        ctx.lineWidth = 0.5;

        ctx.stroke();

      }

    }

  }

}

/*
========================================
ANIMAÇÃO
========================================
*/

function animate(){

  requestAnimationFrame(animate);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  if(faceReady){

    for(let p of particles){

      p.update();
      p.draw();

    }

    connectParticles();

  }

}

animate();

/*
========================================
RESPONSIVO
========================================
*/

window.addEventListener(
  "resize",
  ()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;

  }
);

</script>

</body>
</html>
