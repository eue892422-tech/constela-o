<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Constelação</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
/* ==========================================
   CONFIG
========================================== */

const IMAGE_NAME = "foto.jpg";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

/* ==========================================
   ESTRELAS FUNDO
========================================== */

const bgStars = [];

for(let i=0;i<180;i++){
  bgStars.push({
    x: Math.random()*W,
    y: Math.random()*H,
    s: Math.random()*2,
    a: Math.random()
  });
}

/* ==========================================
   PARTÍCULAS
========================================== */

const particles = [];

/* ==========================================
   RESIZE
========================================== */

window.addEventListener("resize",()=>{
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;
});

/* ==========================================
   CARREGAR IMAGEM
========================================== */

const img = new Image();
img.src = IMAGE_NAME;

img.onload = ()=>{

  /*
    AQUI ESTÁ O ERRO DOS CÓDIGOS ANTIGOS:
    o drawW/drawH ficavam errados
    e criavam um retângulo gigante.

    Agora isso foi corrigido.
  */

  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d");

  /*
    tamanho REAL da imagem
  */

  const iw = img.width;
  const ih = img.height;

  /*
    escala correta proporcional
  */

  const scale = Math.min(
    (W * 0.55) / iw,
    (H * 0.75) / ih
  );

  const drawW = Math.floor(iw * scale);
  const drawH = Math.floor(ih * scale);

  off.width = drawW;
  off.height = drawH;

  offCtx.drawImage(img,0,0,drawW,drawH);

  const data = offCtx.getImageData(0,0,drawW,drawH).data;

  /*
    centralizar corretamente
  */

  const offsetX = (W - drawW)/2;
  const offsetY = (H - drawH)/2;

  /*
    menos partículas = mais leve
  */

  const step = 5;

  for(let y=0;y<drawH;y+=step){

    for(let x=0;x<drawW;x+=step){

      const i = (y * drawW + x) * 4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];

      /*
        detectar somente partes reais da foto
      */

      const brightness = (r+g+b)/3;

      /*
        IGNORA fundo preto/escuro
      */

      if(a > 100 && brightness > 35){

        /*
          posição FINAL da imagem
        */

        const tx = x + offsetX;
        const ty = y + offsetY;

        /*
          partículas começam espalhadas
        */

        particles.push({

          x: Math.random()*W,
          y: Math.random()*H,

          tx,
          ty,

          vx:0,
          vy:0,

          r,
          g,
          b,

          size: Math.random()*1.8 + 0.4
        });
      }
    }
  }
};

/* ==========================================
   ESTRELA CADENTE
========================================== */

const shooting = [];

function spawnShooting(){

  shooting.push({
    x: Math.random()*W,
    y: Math.random()*200,

    vx:-12,
    vy:6,

    life:1
  });
}

setInterval(()=>{
  if(Math.random() > 0.5){
    spawnShooting();
  }
},2500);

/* ==========================================
   DESENHAR
========================================== */

function draw(){

  /*
    FUNDO
  */

  ctx.fillStyle = "#020611";
  ctx.fillRect(0,0,W,H);

  /*
    nebulosa suave
  */

  const g1 = ctx.createRadialGradient(
    W*0.3,H*0.3,0,
    W*0.3,H*0.3,400
  );

  g1.addColorStop(0,"rgba(80,120,255,0.08)");
  g1.addColorStop(1,"transparent");

  ctx.fillStyle = g1;
  ctx.fillRect(0,0,W,H);

  /*
    estrelas fundo
  */

  for(const s of bgStars){

    ctx.beginPath();

    ctx.arc(s.x,s.y,s.s,0,Math.PI*2);

    ctx.fillStyle = `rgba(255,255,255,${s.a})`;

    ctx.fill();
  }

  /*
    partículas da imagem
  */

  for(const p of particles){

    /*
      movimento SUAVE
    */

    const dx = p.tx - p.x;
    const dy = p.ty - p.y;

    p.vx += dx * 0.0035;
    p.vy += dy * 0.0035;

    p.vx *= 0.92;
    p.vy *= 0.92;

    p.x += p.vx;
    p.y += p.vy;

    /*
      brilho
    */

    ctx.beginPath();

    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;

    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgb(${p.r},${p.g},${p.b})`;

    ctx.fill();
  }

  /*
    estrelas cadentes
  */

  for(let i=shooting.length-1;i>=0;i--){

    const s = shooting[i];

    s.x += s.vx;
    s.y += s.vy;

    s.life -= 0.01;

    ctx.beginPath();

    ctx.moveTo(s.x,s.y);

    ctx.lineTo(s.x+70,s.y-35);

    ctx.strokeStyle = `rgba(255,255,255,${s.life})`;

    ctx.lineWidth = 1.5;

    ctx.stroke();

    if(s.life <= 0){
      shooting.splice(i,1);
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
