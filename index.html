<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constelação</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
}

canvas{
  display:block;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/*
========================================
FUNDO ESTRELADO
========================================
*/

const stars = [];

for(let i=0;i<300;i++){

  stars.push({

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2,
    speed:Math.random()*0.5 + 0.1

  });

}

/*
========================================
NEBULOSAS
========================================
*/

const nebulas = [];

for(let i=0;i<7;i++){

  nebulas.push({

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    radius:Math.random()*250 + 120,
    alpha:Math.random()*0.06 + 0.02,
    color:[
      "120,140,255",
      "255,120,220",
      "120,255,220",
      "255,180,120"
    ][Math.floor(Math.random()*4)]

  });

}

/*
========================================
PLANETAS
========================================
*/

const planets = [];

for(let i=0;i<5;i++){

  planets.push({

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    radius:Math.random()*50 + 20,
    glow:Math.random()*40 + 20,
    color:[
      "#6ea8ff",
      "#ff8ad8",
      "#ffd36e",
      "#98ffda"
    ][Math.floor(Math.random()*4)]

  });

}

/*
========================================
PARTÍCULAS ROSTO
========================================
*/

const particles = [];

class Particle{

  constructor(x,y,tx,ty,color){

    this.x = x;
    this.y = y;

    this.tx = tx;
    this.ty = ty;

    this.color = color;

    this.size =
      Math.random()*1.4 + 0.3;

    this.vx = 0;
    this.vy = 0;

    this.alpha = 0;

  }

  update(){

    let dx = this.tx - this.x;
    let dy = this.ty - this.y;

    this.vx += dx * 0.008;
    this.vy += dy * 0.008;

    this.vx *= 0.90;
    this.vy *= 0.90;

    this.x += this.vx;
    this.y += this.vy;

    if(this.alpha < 1){

      this.alpha += 0.015;

    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle = `
      rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        ${this.alpha}
      )
    `;

    ctx.shadowBlur = 12;

    ctx.shadowColor = `
      rgba(
        ${this.color.r},
        ${this.color.g},
        ${this.color.b},
        1
      )
    `;

    ctx.fill();

  }

}

/*
========================================
FOTO
========================================
*/

const img = new Image();

img.src = "foto.jpg";

img.onload = () => {

  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d");

  const scale = 0.55;

  off.width = img.width * scale;
  off.height = img.height * scale;

  offCtx.drawImage(
    img,
    0,
    0,
    off.width,
    off.height
  );

  const data = offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  for(let y=0;y<off.height;y+=4){

    for(let x=0;x<off.width;x+=4){

      const index =
        (y*off.width+x)*4;

      const r = data[index];
      const g = data[index+1];
      const b = data[index+2];
      const a = data[index+3];

      const brightness =
        (r+g+b)/3;

      if(a > 100 && brightness > 40){

        const tx =
          x +
          canvas.width/2 -
          off.width/2;

        const ty =
          y +
          canvas.height/2 -
          off.height/2;

        /*
        ========================================
        COMEÇAR DO CÉU
        ========================================
        */

        const startX =
          tx +
          (Math.random()-0.5)*350;

        const startY =
          -Math.random()*canvas.height;

        particles.push(

          new Particle(

            startX,
            startY,

            tx,
            ty,

            {r,g,b}

          )

        );

      }

    }

  }

};

/*
========================================
FUNDO ESTRELAS
========================================
*/

function drawStars(){

  for(let s of stars){

    s.y += s.speed;

    if(s.y > canvas.height){

      s.y = -10;
      s.x = Math.random()*canvas.width;

    }

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.9)";

    ctx.shadowBlur = 10;
    ctx.shadowColor = "white";

    ctx.fill();

  }

}

/*
========================================
NEBULOSAS
========================================
*/

function drawNebulas(){

  for(let n of nebulas){

    const gradient =
      ctx.createRadialGradient(
        n.x,
        n.y,
        0,
        n.x,
        n.y,
        n.radius
      );

    gradient.addColorStop(
      0,
      `rgba(${n.color},${n.alpha})`
    );

    gradient.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
      n.x,
      n.y,
      n.radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

/*
========================================
PLANETAS
========================================
*/

function drawPlanets(){

  for(let p of planets){

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle = p.color;

    ctx.shadowBlur = p.glow;
    ctx.shadowColor = p.color;

    ctx.fill();

    /*
    ========================================
    ANEL
    ========================================
    */

    ctx.beginPath();

    ctx.ellipse(
      p.x,
      p.y,
      p.radius+15,
      p.radius/2,
      Math.PI/6,
      0,
      Math.PI*2
    );

    ctx.strokeStyle =
      "rgba(255,255,255,0.15)";

    ctx.lineWidth = 2;

    ctx.stroke();

  }

}

/*
========================================
CONSTELAÇÕES FUNDO
========================================
*/

function drawGalaxyConnections(){

  for(let i=0;i<stars.length;i++){

    for(let j=i+1;j<stars.length;j++){

      const dx =
        stars[i].x -
        stars[j].x;

      const dy =
        stars[i].y -
        stars[j].y;

      const dist =
        Math.sqrt(dx*dx + dy*dy);

      if(dist < 80){

        ctx.beginPath();

        ctx.moveTo(
          stars[i].x,
          stars[i].y
        );

        ctx.lineTo(
          stars[j].x,
          stars[j].y
        );

        ctx.strokeStyle =
          "rgba(255,255,255,0.02)";

        ctx.lineWidth = 0.4;

        ctx.stroke();

      }

    }

  }

}

/*
========================================
LINHAS DO ROSTO
========================================
*/

function connectParticles(){

  for(let a=0;a<particles.length;a++){

    for(let b=a+1;b<particles.length;b++){

      const dx =
        particles[a].x -
        particles[b].x;

      const dy =
        particles[a].y -
        particles[b].y;

      const dist =
        Math.sqrt(dx*dx + dy*dy);

      if(dist < 10){

        ctx.beginPath();

        ctx.moveTo(
          particles[a].x,
          particles[a].y
        );

        ctx.lineTo(
          particles[b].x,
          particles[b].y
        );

        ctx.strokeStyle =
          "rgba(255,255,255,0.04)";

        ctx.lineWidth = 0.5;

        ctx.stroke();

      }

    }

  }

}

/*
========================================
ANIMAÇÃO
========================================
*/

function animate(){

  requestAnimationFrame(animate);

  ctx.fillStyle =
    "rgba(0,0,0,0.22)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawNebulas();

  drawGalaxyConnections();

  drawStars();

  drawPlanets();

  for(let p of particles){

    p.update();
    p.draw();

  }

  connectParticles();

}

animate();

/*
========================================
RESPONSIVO
========================================
*/

window.addEventListener(
  "resize",
  ()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;

  }
);

</script>

</body>
</html>
