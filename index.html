<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constelação</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

body{
  background:
  radial-gradient(circle at top,#07111f 0%,#01050b 50%,#000 100%);
}

canvas{
  display:block;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

/*
==================================================
CANVAS
==================================================
*/

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

/*
==================================================
CONFIG
==================================================
*/

const CONFIG={

  /*
  FOTO
  */

  imageUrl:"foto.jpg",

  /*
  MAIS DETALHE
  */

  maxParticles:950,

  /*
  VELOCIDADE
  */

  spring:0.15,
  friction:0.82,

  /*
  DISTÂNCIA INICIAL
  */

  spawnRadius:320,

  /*
  LINHAS
  */

  connectDistance:12,

  /*
  FUNDO
  */

  bgStars:160,
  movingStars:45,

  /*
  TAMANHO DA FOTO
  */

  imageScale:0.46

};

/*
==================================================
UTILS
==================================================
*/

function rand(min,max){

  return Math.random()*(max-min)+min;

}

/*
==================================================
FUNDO
==================================================
*/

const bgStars=[];

for(let i=0;i<CONFIG.bgStars;i++){

  bgStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.4,2),

    alpha:rand(0.2,1)

  });

}

/*
==================================================
ESTRELAS CAINDO
==================================================
*/

const movingStars=[];

for(let i=0;i<CONFIG.movingStars;i++){

  movingStars.push({

    x:rand(0,W),
    y:rand(-H,H),

    size:rand(0.7,2.4),

    speed:rand(0.05,0.20),

    glow:rand(4,12),

    pulse:rand(0,Math.PI*2)

  });

}

/*
==================================================
ESTRELAS CADENTES
==================================================
*/

const shootingStars=[];

class ShootingStar{

  constructor(){

    this.reset();

  }

  reset(){

    this.x=rand(W*0.2,W);
    this.y=rand(-100,H*0.3);

    this.len=rand(80,180);

    this.speed=rand(8,16);

    this.alpha=rand(0.4,1);

  }

  update(){

    this.x-=this.speed;
    this.y+=this.speed*0.5;

    if(this.x<-200 || this.y>H+200){

      this.reset();

    }

  }

  draw(){

    ctx.beginPath();

    ctx.moveTo(this.x,this.y);

    ctx.lineTo(
      this.x+this.len,
      this.y-this.len*0.5
    );

    ctx.strokeStyle=
    `rgba(255,255,255,${this.alpha})`;

    ctx.lineWidth=1.2;

    ctx.shadowBlur=12;
    ctx.shadowColor="white";

    ctx.stroke();

  }

}

for(let i=0;i<2;i++){

  shootingStars.push(
    new ShootingStar()
  );

}

/*
==================================================
PARTÍCULAS
==================================================
*/

const particles=[];

class Particle{

  constructor(x,y,tx,ty,color){

    this.x=x;
    this.y=y;

    this.tx=tx;
    this.ty=ty;

    this.vx=rand(-1,1);
    this.vy=rand(-1,1);

    this.size=rand(0.7,1.8);

    this.alpha=0;

    this.color=color;

  }

  update(){

    const dx=this.tx-this.x;
    const dy=this.ty-this.y;

    this.vx+=dx*CONFIG.spring;
    this.vy+=dy*CONFIG.spring;

    this.vx*=CONFIG.friction;
    this.vy*=CONFIG.friction;

    this.x+=this.vx;
    this.y+=this.vy;

    if(this.alpha<1){

      this.alpha+=0.02;

    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(
      ${this.color.r},
      ${this.color.g},
      ${this.color.b},
      ${this.alpha}
    )`;

    ctx.shadowBlur=12;

    ctx.shadowColor=
    `rgb(
      ${this.color.r},
      ${this.color.g},
      ${this.color.b}
    )`;

    ctx.fill();

  }

}

/*
==================================================
CRIAR ROSTO
==================================================
*/

const img=new Image();

img.src=CONFIG.imageUrl;

img.onload=()=>{

  const off=document.createElement("canvas");
  const offCtx=off.getContext("2d");

  const scale=Math.min(

    (W*CONFIG.imageScale)/img.width,
    (H*0.72)/img.height

  );

  off.width=img.width*scale;
  off.height=img.height*scale;

  offCtx.drawImage(
    img,
    0,
    0,
    off.width,
    off.height
  );

  const data=offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  const offsetX=
  W/2-off.width/2;

  const offsetY=
  H/2-off.height/2;

  let created=0;

  /*
  PIXELS ALEATÓRIOS
  */

  for(let i=0;i<120000;i++){

    const x=Math.floor(
      Math.random()*off.width
    );

    const y=Math.floor(
      Math.random()*off.height
    );

    const index=
    (y*off.width+x)*4;

    const r=data[index];
    const g=data[index+1];
    const b=data[index+2];
    const a=data[index+3];

    if(a<20) continue;

    /*
    BRILHO
    */

    const brightness=
    (r+g+b)/3;

    /*
    CONTRASTE
    */

    const contrast=
    Math.max(r,g,b)-
    Math.min(r,g,b);

    /*
    DETECÇÃO MELHOR
    */

    if(
      brightness>28 ||
      contrast>18
    ){

      const tx=x+offsetX;
      const ty=y+offsetY;

      /*
      COMEÇAM NO CÉU
      */

      const startX=
      tx+rand(
        -CONFIG.spawnRadius,
         CONFIG.spawnRadius
      );

      const startY=
      -rand(50,H);

      particles.push(

        new Particle(

          startX,
          startY,

          tx,
          ty,

          {r,g,b}

        )

      );

      created++;

      if(created>=CONFIG.maxParticles){

        break;

      }

    }

  }

};

/*
==================================================
FUNDO
==================================================
*/

function drawBackgroundStars(){

  for(let s of bgStars){

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(255,255,255,${s.alpha})`;

    ctx.fill();

  }

}

/*
==================================================
ESTRELAS MOVIMENTO
==================================================
*/

function drawMovingStars(time){

  for(let s of movingStars){

    s.y+=s.speed;

    if(s.y>H+10){

      s.y=-20;
      s.x=rand(0,W);

    }

    const pulse=
    0.7+
    Math.sin(
      time*0.002+s.pulse
    )*0.3;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(255,255,255,${pulse})`;

    ctx.shadowBlur=s.glow;
    ctx.shadowColor="white";

    ctx.fill();

  }

}

/*
==================================================
ESTRELAS CADENTES
==================================================
*/

function drawShootingStars(){

  for(let s of shootingStars){

    s.update();
    s.draw();

  }

}

/*
==================================================
LINHAS
==================================================
*/

function connectParticles(){

  for(let i=0;i<particles.length;i++){

    const a=particles[i];

    for(
      let j=i+1;
      j<i+6 && j<particles.length;
      j++
    ){

      const b=particles[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;

      const dist=
      Math.sqrt(dx*dx+dy*dy);

      if(dist<CONFIG.connectDistance){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle=
        "rgba(255,255,255,0.05)";

        ctx.lineWidth=0.4;

        ctx.stroke();

      }

    }

  }

}

/*
==================================================
ANIMAÇÃO
==================================================
*/

function animate(time=0){

  requestAnimationFrame(animate);

  /*
  SEM TELA CINZA
  */

  ctx.clearRect(0,0,W,H);

  /*
  FUNDO
  */

  drawBackgroundStars();

  drawMovingStars(time);

  drawShootingStars();

  /*
  PARTÍCULAS
  */

  for(let p of particles){

    p.update();
    p.draw();

  }

  /*
  CONSTELAÇÕES
  */

  connectParticles();

}

animate();

/*
==================================================
RESIZE
==================================================
*/

addEventListener("resize",()=>{

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

});

</script>

</body>
</html>
