<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Constelação</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020611;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
/* ==========================================
   CONFIG
========================================== */

const IMAGE_NAME = "foto.jpg";

/*
  MENOR = MAIS DETALHE
*/
const PIXEL_STEP = 3;

/*
  MAIS PARTÍCULAS
*/
const MAX_PARTICLES = 12000;

/*
  AJUDA A PEGAR O CABELO ESCURO
*/
const DARK_THRESHOLD = 12;

/*
  VELOCIDADE
*/
const SPRING = 0.010;
const FRICTION = 0.90;

/* ========================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

/* ==========================================
   FUNDO
========================================== */

const bgStars = [];

for(let i=0;i<250;i++){

  bgStars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    s:Math.random()*2.2,
    a:Math.random()
  });
}

/* ==========================================
   PARTÍCULAS
========================================== */

const particles = [];

/* ==========================================
   RESIZE
========================================== */

addEventListener("resize",()=>{

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
});

/* ==========================================
   CARREGAR FOTO
========================================== */

const img = new Image();
img.src = IMAGE_NAME;

img.onload = ()=>{

  const off = document.createElement("canvas");
  const octx = off.getContext("2d");

  /*
    TAMANHO MAIS BONITO
  */

  const scale = Math.min(

    (W * 0.62) / img.width,
    (H * 0.82) / img.height
  );

  const drawW = img.width * scale;
  const drawH = img.height * scale;

  off.width = drawW;
  off.height = drawH;

  octx.drawImage(img,0,0,drawW,drawH);

  const data = octx.getImageData(
    0,
    0,
    drawW,
    drawH
  ).data;

  const offsetX = W/2 - drawW/2;
  const offsetY = H/2 - drawH/2;

  let count = 0;

  /*
    AGORA PEGA MUITO MAIS DETALHE
    inclusive cabelo escuro
  */

  for(let y=0;y<drawH;y+=PIXEL_STEP){

    for(let x=0;x<drawW;x+=PIXEL_STEP){

      if(count > MAX_PARTICLES) break;

      const i = (y * drawW + x) * 4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];

      const brightness = (r+g+b)/3;

      /*
        ISSO RESOLVE O CABELO
      */

      const isVisible =
        brightness > DARK_THRESHOLD ||
        Math.abs(r-g) > 8 ||
        Math.abs(r-b) > 8;

      if(a > 80 && isVisible){

        particles.push({

          x:Math.random()*W,
          y:Math.random()*H,

          tx:x + offsetX,
          ty:y + offsetY,

          vx:(Math.random()-0.5)*8,
          vy:(Math.random()-0.5)*8,

          r,g,b,

          size:Math.random()*1.4 + 0.6
        });

        count++;
      }
    }
  }
};

/* ==========================================
   ESTRELA CADENTE
========================================== */

const shooting = [];

function spawnShooting(){

  shooting.push({

    x:Math.random()*W,
    y:Math.random()*250,

    vx:-14,
    vy:7,

    life:1
  });
}

setInterval(()=>{

  if(Math.random() > 0.4){
    spawnShooting();
  }

},2200);

/* ==========================================
   ANIMAÇÃO
========================================== */

function animate(){

  requestAnimationFrame(animate);

  /*
    FUNDO
  */

  ctx.fillStyle = "#020611";
  ctx.fillRect(0,0,W,H);

  /*
    NEBULOSA
  */

  const neb = ctx.createRadialGradient(
    W*0.5,
    H*0.4,
    0,
    W*0.5,
    H*0.4,
    500
  );

  neb.addColorStop(0,"rgba(60,120,255,0.08)");
  neb.addColorStop(1,"transparent");

  ctx.fillStyle = neb;
  ctx.fillRect(0,0,W,H);

  /*
    ESTRELAS FUNDO
  */

  for(const s of bgStars){

    ctx.beginPath();

    ctx.arc(s.x,s.y,s.s,0,Math.PI*2);

    ctx.fillStyle = `rgba(255,255,255,${s.a})`;

    ctx.fill();
  }

  /*
    PARTÍCULAS DA FOTO
  */

  for(const p of particles){

    const dx = p.tx - p.x;
    const dy = p.ty - p.y;

    /*
      MAIS SUAVE E MAIS RÁPIDO
    */

    p.vx += dx * SPRING;
    p.vy += dy * SPRING;

    p.vx *= FRICTION;
    p.vy *= FRICTION;

    p.x += p.vx;
    p.y += p.vy;

    /*
      BRILHO
    */

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;

    ctx.shadowBlur = 8;

    ctx.shadowColor =
      `rgb(${p.r},${p.g},${p.b})`;

    ctx.fill();
  }

  /*
    ESTRELAS CADENTES
  */

  for(let i=shooting.length-1;i>=0;i--){

    const s = shooting[i];

    s.x += s.vx;
    s.y += s.vy;

    s.life -= 0.012;

    ctx.beginPath();

    ctx.moveTo(s.x,s.y);

    ctx.lineTo(
      s.x + 80,
      s.y - 40
    );

    ctx.strokeStyle =
      `rgba(255,255,255,${s.life})`;

    ctx.lineWidth = 1.5;

    ctx.shadowBlur = 10;
    ctx.shadowColor = "white";

    ctx.stroke();

    if(s.life <= 0){

      shooting.splice(i,1);
    }
  }
}

animate();
</script>

</body>
</html>
