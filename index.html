<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Constellation Portrait</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#020611;
      font-family:Arial,sans-serif;
    }

    canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      background:
        radial-gradient(circle at top,#071224 0%,#020611 45%,#00040b 100%);
    }

    .loading{
      position:fixed;
      bottom:25px;
      left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,.7);
      font-size:14px;
      letter-spacing:.04em;
      z-index:10;
      opacity:.8;
    }
  </style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="loading">
  ✨ formando retrato...
</div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const stars = [];
const flyingStars = [];

const bgStarCount = 240;

for(let i=0;i<bgStarCount;i++){

  stars.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    r:Math.random()*2.2 + 0.2,
    a:Math.random()*1,
    t:Math.random()*1000
  });
}

for(let i=0;i<220;i++){

  flyingStars.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    tx:window.innerWidth/2 + (Math.random()-0.5)*700,
    ty:window.innerHeight/2 + (Math.random()-0.5)*900,
    r:Math.random()*2.5 + 0.5,
    speed:Math.random()*0.015 + 0.008,
    life:1
  });
}

const portrait = new Image();

portrait.src = "portrait.png";

let portraitOpacity = 0;

let animationFinished = false;

function drawGlow(x,y,r,a){

  const g = ctx.createRadialGradient(x,y,0,x,y,r*6);

  g.addColorStop(0,`rgba(255,255,255,${a})`);
  g.addColorStop(0.3,`rgba(180,210,255,${a*0.5})`);
  g.addColorStop(1,"rgba(180,210,255,0)");

  ctx.beginPath();
  ctx.fillStyle = g;
  ctx.arc(x,y,r*6,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function drawBackground(time){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const s of stars){

    const twinkle =
      0.65 + Math.sin(time*0.001 + s.t)*0.35;

    drawGlow(
      s.x,
      s.y,
      s.r*twinkle,
      s.a*twinkle
    );
  }
}

function drawFlyingStars(){

  let done = true;

  for(const s of flyingStars){

    if(s.life > 0){

      done = false;

      s.x += (s.tx - s.x)*s.speed;
      s.y += (s.ty - s.y)*s.speed;

      s.life -= 0.004;

      drawGlow(s.x,s.y,s.r,s.life);
    }
  }

  if(done){
    animationFinished = true;
  }
}

function drawPortrait(){

  if(!portrait.complete) return;

  if(portraitOpacity < 1){
    portraitOpacity += 0.01;
  }

  const maxW = canvas.width * 0.82;
  const maxH = canvas.height * 0.9;

  let w = portrait.width;
  let h = portrait.height;

  const scale = Math.min(maxW/w,maxH/h);

  w *= scale;
  h *= scale;

  const x = canvas.width/2 - w/2;
  const y = canvas.height/2 - h/2;

  ctx.save();

  ctx.globalAlpha = portraitOpacity;

  ctx.shadowColor = "rgba(180,210,255,.35)";
  ctx.shadowBlur = 18;

  ctx.drawImage(portrait,x,y,w,h);

  ctx.restore();
}

function animate(time){

  drawBackground(time);

  if(!animationFinished){

    drawFlyingStars();

  }else{

    drawPortrait();
  }

  requestAnimationFrame(animate);
}

portrait.onload = () => {

  requestAnimationFrame(animate);
};

portrait.onerror = () => {

  alert(
    "ERRO: coloque a imagem portrait.png na mesma pasta do index.html"
  );
};
</script>

</body>
</html>
