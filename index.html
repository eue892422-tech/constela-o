<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constelação</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

canvas{
  display:block;
  background:
  radial-gradient(circle at center,
  #06152b 0%,
  #01040a 60%,
  black 100%);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

/* =========================
CONFIG
========================= */

const IMAGE = "foto.jpg";

const stars = [];
const particles = [];

const STAR_COUNT = 180;
const PARTICLE_GAP = 7;
const MAX_PARTICLES = 1200;

/* =========================
FUNDO
========================= */

for(let i=0;i<STAR_COUNT;i++){

  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*2,
    a:Math.random(),
    s:Math.random()*0.5+0.2
  });

}

function drawBackground(){

  ctx.fillStyle="#020812";
  ctx.fillRect(0,0,W,H);

  for(const s of stars){

    s.y += s.s;

    if(s.y > H){
      s.y = 0;
      s.x = Math.random()*W;
    }

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

    ctx.fillStyle=`rgba(255,255,255,${s.a})`;

    ctx.shadowBlur=8;
    ctx.shadowColor="white";

    ctx.fill();
  }
}

/* =========================
PARTÍCULAS
========================= */

class Particle{

  constructor(tx,ty,color){

    this.tx = tx;
    this.ty = ty;

    this.x = Math.random()*W;
    this.y = Math.random()*H;

    this.vx = 0;
    this.vy = 0;

    this.size = Math.random()*1.8+0.5;

    this.color = color;
  }

  update(){

    const dx = this.tx - this.x;
    const dy = this.ty - this.y;

    this.vx += dx * 0.015;
    this.vy += dy * 0.015;

    this.vx *= 0.92;
    this.vy *= 0.92;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=this.color;

    ctx.shadowBlur=12;
    ctx.shadowColor=this.color;

    ctx.fill();
  }
}

/* =========================
CRIAR ROSTO
========================= */

function createFace(img){

  particles.length = 0;

  const off = document.createElement("canvas");
  const octx = off.getContext("2d");

  const scale = Math.min(
    W*0.42/img.width,
    H*0.65/img.height
  );

  const iw = img.width*scale;
  const ih = img.height*scale;

  off.width = iw;
  off.height = ih;

  octx.drawImage(img,0,0,iw,ih);

  const data =
  octx.getImageData(0,0,iw,ih).data;

  const ox = W/2 - iw/2;
  const oy = H/2 - ih/2;

  /*
  máscara circular
  */

  const cx = iw/2;
  const cy = ih/2;

  for(let y=0;y<ih;y+=PARTICLE_GAP){

    for(let x=0;x<iw;x+=PARTICLE_GAP){

      /*
      evita retângulo
      */

      const dx = x-cx;
      const dy = y-cy;

      const dist =
      Math.sqrt(dx*dx+dy*dy);

      if(dist > iw*0.42){
        continue;
      }

      const i=(y*iw+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];
      const a=data[i+3];

      if(a < 100) continue;

      const brightness=(r+g+b)/3;

      /*
      remove fundo escuro
      */

      if(brightness < 45){
        continue;
      }

      /*
      remove fundo cinza
      */

      if(
        Math.abs(r-g)<15 &&
        Math.abs(g-b)<15 &&
        brightness>130
      ){
        continue;
      }

      particles.push(
        new Particle(
          x+ox,
          y+oy,
          `rgb(${r},${g},${b})`
        )
      );

      if(
        particles.length >
        MAX_PARTICLES
      ){
        return;
      }

    }
  }
}

/* =========================
ANIMAÇÃO
========================= */

function animate(){

  requestAnimationFrame(animate);

  drawBackground();

  for(const p of particles){

    p.update();
    p.draw();

  }
}

/* =========================
LOAD
========================= */

const img = new Image();

img.src = IMAGE;

img.onload = ()=>{

  createFace(img);

  animate();

};

img.onerror = ()=>{

  alert(
    "foto.jpg não encontrada"
  );

};
</script>

</body>
</html>
