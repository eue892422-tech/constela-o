<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Constelação</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:black;
      font-family:Arial, sans-serif;
    }

    canvas{
      position:fixed;
      inset:0;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      pointer-events:none;
    }

    h1{
      color:white;
      font-size:3rem;
      opacity:0;
      animation:fadeIn 3s ease forwards;
      letter-spacing:4px;
      text-shadow:0 0 20px white;
    }

    p{
      color:#ccc;
      margin-top:20px;
      font-size:1.1rem;
      opacity:0;
      animation:fadeIn 3s ease forwards;
      animation-delay:2s;
    }

    @keyframes fadeIn{
      to{
        opacity:1;
      }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="overlay">
  <h1>Você é meu universo</h1>
  <p>Bilhões de estrelas... mas nenhuma brilha como você.</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];
let stars = [];

const image = new Image();

/*
========================================
COLOQUE O NOME DA FOTO AQUI
========================================
*/

image.src = "foto.jpg";

class Particle{
  constructor(x,y,targetX,targetY,size){
    this.x = x;
    this.y = y;

    this.tx = targetX;
    this.ty = targetY;

    this.size = size;

    this.vx = 0;
    this.vy = 0;
  }

  update(){

    let dx = this.tx - this.x;
    let dy = this.ty - this.y;

    this.vx += dx * 0.002;
    this.vy += dy * 0.002;

    this.vx *= 0.92;
    this.vy *= 0.92;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(){

    ctx.beginPath();

    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

    ctx.fillStyle = "white";

    ctx.shadowColor = "white";
    ctx.shadowBlur = 15;

    ctx.fill();
  }
}

function createBackgroundStars(){

  for(let i=0;i<300;i++){

    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      size:Math.random()*2
    });

  }

}

function drawBackgroundStars(){

  for(let s of stars){

    ctx.beginPath();

    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);

    ctx.fillStyle = "rgba(255,255,255,0.7)";

    ctx.fill();

  }

}

image.onload = () => {

  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d");

  const scale = 0.55;

  off.width = image.width * scale;
  off.height = image.height * scale;

  offCtx.drawImage(image,0,0,off.width,off.height);

  const data = offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  for(let y=0;y<off.height;y+=3){

    for(let x=0;x<off.width;x+=3){

      const index = (y*off.width + x)*4;

      const r = data[index];
      const g = data[index+1];
      const b = data[index+2];
      const a = data[index+3];

      const brightness = (r+g+b)/3;

      if(a > 100 && brightness > 40){

        const px = x + canvas.width/2 - off.width/2;
        const py = y + canvas.height/2 - off.height/2;

        particles.push(
          new Particle(
            Math.random()*canvas.width,
            Math.random()*canvas.height,
            px,
            py,
            1.2
          )
        );

      }

    }

  }

};

createBackgroundStars();

function connectParticles(){

  for(let a=0;a<particles.length;a++){

    for(let b=a;b<particles.length;b++){

      let dx = particles[a].x - particles[b].x;
      let dy = particles[a].y - particles[b].y;

      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < 12){

        ctx.beginPath();

        ctx.moveTo(
          particles[a].x,
          particles[a].y
        );

        ctx.lineTo(
          particles[b].x,
          particles[b].y
        );

        ctx.strokeStyle =
          "rgba(255,255,255,0.08)";

        ctx.lineWidth = 0.4;

        ctx.stroke();

      }

    }

  }

}

function animate(){

  requestAnimationFrame(animate);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackgroundStars();

  for(let p of particles){

    p.update();
    p.draw();

  }

  connectParticles();

}

animate();

window.addEventListener("resize",()=>{

  canvas.width = innerWidth;
  canvas.height = innerHeight;

});
</script>

</body>
</html>
