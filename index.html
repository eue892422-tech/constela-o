<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrato Estelar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01040a;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    background:
    radial-gradient(circle at top,
    #071427 0%,
    #020611 50%,
    #01040a 100%);
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();

window.addEventListener("resize", resize);

const stars = [];
const particles = [];

const portrait = new Image();

portrait.src = "./portrait.png";

let loaded = false;

portrait.onload = () => {

    loaded = true;

    console.log("imagem carregada");
};

portrait.onerror = () => {

    console.log("ERRO AO CARREGAR portrait.png");
};

function rand(min,max){

    return Math.random() * (max-min) + min;
}

for(let i=0;i<180;i++){

    stars.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2 + 0.2,
        a:Math.random()*0.7 + 0.2,
        p:Math.random()*Math.PI*2
    });
}

for(let i=0;i<260;i++){

    particles.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,

        vx:rand(-1.5,1.5),
        vy:rand(-1.5,1.5),

        r:rand(1,3),

        alpha:1
    });
}

function drawGlow(x,y,r,a){

    const g = ctx.createRadialGradient(
        x,y,0,
        x,y,r*6
    );

    g.addColorStop(0,`rgba(255,255,255,${a})`);
    g.addColorStop(.2,`rgba(210,225,255,${a*.9})`);
    g.addColorStop(.45,`rgba(120,170,255,${a*.25})`);
    g.addColorStop(1,"rgba(120,170,255,0)");

    ctx.beginPath();
    ctx.fillStyle = g;
    ctx.arc(x,y,r*6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
}

let reveal = 0;

function drawBackground(time){

    for(const s of stars){

        const twinkle =
        0.7 + Math.sin(time*0.001 + s.p)*0.3;

        drawGlow(
            s.x,
            s.y,
            s.r * twinkle,
            s.a
        );
    }
}

function drawParticles(){

    for(const p of particles){

        p.x += p.vx;
        p.y += p.vy;

        p.alpha -= 0.003;

        if(p.alpha < 0){

            p.alpha = 0;
        }

        drawGlow(
            p.x,
            p.y,
            p.r,
            p.alpha
        );
    }
}

function drawPortrait(){

    if(!loaded) return;

    if(reveal < 1){

        reveal += 0.003;
    }

    const ratio =
    portrait.width / portrait.height;

    let w = canvas.width * 0.72;
    let h = w / ratio;

    if(h > canvas.height * 0.9){

        h = canvas.height * 0.9;
        w = h * ratio;
    }

    const x =
    canvas.width/2 - w/2;

    const y =
    canvas.height/2 - h/2;

    ctx.save();

    ctx.globalAlpha = reveal;

    ctx.shadowBlur = 18;

    ctx.shadowColor =
    "rgba(180,220,255,.25)";

    ctx.drawImage(
        portrait,
        x,
        y,
        w,
        h
    );

    ctx.restore();
}

function animate(time){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground(time);

    drawPortrait();

    drawParticles();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
