<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Constelação Real</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

body{
  background:
  radial-gradient(circle at center,#081320 0%,#02050b 55%,#000 100%);
}

canvas{
  display:block;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

/*
==================================================
CANVAS
==================================================
*/

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

/*
==================================================
CONFIG
==================================================
*/

const CONFIG={

  imageUrl:"foto.jpg",

  /*
  MUITO MAIS DEFINIÇÃO
  */

  maxParticles:2200,

  /*
  MAIS RÁPIDO
  */

  spring:0.045,
  friction:0.90,

  /*
  COMEÇAM LONGE
  */

  spawnRadius:900,

  /*
  TAMANHO FOTO
  */

  imageScale:0.55,

  /*
  FUNDO
  */

  bgStars:170,
  movingStars:55,

  /*
  LINHAS
  */

  connectDistance:16

};

/*
==================================================
UTILS
==================================================
*/

function rand(min,max){

  return Math.random()*(max-min)+min;

}

/*
==================================================
FUNDO
==================================================
*/

const bgStars=[];

for(let i=0;i<CONFIG.bgStars;i++){

  bgStars.push({

    x:rand(0,W),
    y:rand(0,H),

    size:rand(0.3,2),

    alpha:rand(0.2,1)

  });

}

/*
==================================================
ESTRELAS MOVENDO
==================================================
*/

const movingStars=[];

for(let i=0;i<CONFIG.movingStars;i++){

  movingStars.push({

    x:rand(0,W),
    y:rand(-H,H),

    size:rand(0.5,2.3),

    speed:rand(0.05,0.18),

    pulse:rand(0,Math.PI*2),

    glow:rand(4,14)

  });

}

/*
==================================================
ESTRELAS CADENTES
==================================================
*/

const shootingStars=[];

class ShootingStar{

  constructor(){

    this.reset();

  }

  reset(){

    this.x=rand(W*0.2,W);
    this.y=rand(-100,H*0.4);

    this.len=rand(90,180);

    this.speed=rand(7,15);

    this.alpha=rand(0.5,1);

  }

  update(){

    this.x-=this.speed;
    this.y+=this.speed*0.45;

    if(this.x<-200 || this.y>H+200){

      this.reset();

    }

  }

  draw(){

    ctx.beginPath();

    ctx.moveTo(this.x,this.y);

    ctx.lineTo(
      this.x+this.len,
      this.y-this.len*0.45
    );

    ctx.strokeStyle=
    `rgba(255,255,255,${this.alpha})`;

    ctx.lineWidth=1.2;

    ctx.shadowBlur=14;
    ctx.shadowColor="white";

    ctx.stroke();

  }

}

for(let i=0;i<2;i++){

  shootingStars.push(
    new ShootingStar()
  );

}

/*
==================================================
PARTÍCULAS
==================================================
*/

const particles=[];

class Particle{

  constructor(x,y,tx,ty,color){

    this.x=x;
    this.y=y;

    this.tx=tx;
    this.ty=ty;

    this.vx=rand(-1,1);
    this.vy=rand(-1,1);

    this.size=rand(0.5,1.7);

    this.alpha=0;

    this.color=color;

  }

  update(){

    const dx=this.tx-this.x;
    const dy=this.ty-this.y;

    this.vx+=dx*CONFIG.spring;
    this.vy+=dy*CONFIG.spring;

    this.vx*=CONFIG.friction;
    this.vy*=CONFIG.friction;

    this.x+=this.vx;
    this.y+=this.vy;

    if(this.alpha<1){

      this.alpha+=0.01;

    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(
      ${this.color.r},
      ${this.color.g},
      ${this.color.b},
      ${this.alpha}
    )`;

    ctx.shadowBlur=10;

    ctx.shadowColor=
    `rgb(
      ${this.color.r},
      ${this.color.g},
      ${this.color.b}
    )`;

    ctx.fill();

  }

}

/*
==================================================
CRIAR ROSTO
==================================================
*/

const img=new Image();

img.src=CONFIG.imageUrl;

img.onload=()=>{

  const off=document.createElement("canvas");
  const offCtx=off.getContext("2d");

  const scale=Math.min(

    (W*CONFIG.imageScale)/img.width,
    (H*0.75)/img.height

  );

  off.width=img.width*scale;
  off.height=img.height*scale;

  offCtx.drawImage(
    img,
    0,
    0,
    off.width,
    off.height
  );

  const data=offCtx.getImageData(
    0,
    0,
    off.width,
    off.height
  ).data;

  const offsetX=
  W/2-off.width/2;

  const offsetY=
  H/2-off.height/2;

  let created=0;

  /*
  ESCANEAR IMAGEM INTEIRA
  */

  for(let y=0;y<off.height;y+=2){

    for(let x=0;x<off.width;x+=2){

      const index=
      (y*off.width+x)*4;

      const r=data[index];
      const g=data[index+1];
      const b=data[index+2];
      const a=data[index+3];

      if(a<20) continue;

      /*
      BRILHO
      */

      const brightness=
      (r+g+b)/3;

      /*
      DIFERENÇA DE COR
      */

      const contrast=
      Math.max(r,g,b)-
      Math.min(r,g,b);

      /*
      PEGA QUASE TUDO
      */

      if(
        brightness>18 ||
        contrast>8
      ){

        /*
        ALEATÓRIO
        */

        if(Math.random()>0.35){

          continue;

        }

        const tx=x+offsetX;
        const ty=y+offsetY;

        /*
        NASCEM LONGE
        */

        const angle=
        Math.random()*Math.PI*2;

        const radius=
        rand(200,CONFIG.spawnRadius);

        const startX=
        tx+Math.cos(angle)*radius;

        const startY=
        ty+Math.sin(angle)*radius;

        particles.push(

          new Particle(

            startX,
            startY,

            tx,
            ty,

            {r,g,b}

          )

        );

        created++;

        if(created>=CONFIG.maxParticles){

          break;

        }

      }

    }

    if(created>=CONFIG.maxParticles){

      break;

    }

  }

};

/*
==================================================
FUNDO
==================================================
*/

function drawBackgroundStars(){

  for(let s of bgStars){

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(255,255,255,${s.alpha})`;

    ctx.fill();

  }

}

/*
==================================================
ESTRELAS MOVENDO
==================================================
*/

function drawMovingStars(time){

  for(let s of movingStars){

    s.y+=s.speed;

    if(s.y>H+20){

      s.y=-20;
      s.x=rand(0,W);

    }

    const pulse=
    0.7+
    Math.sin(
      time*0.002+s.pulse
    )*0.3;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    `rgba(255,255,255,${pulse})`;

    ctx.shadowBlur=s.glow;
    ctx.shadowColor="white";

    ctx.fill();

  }

}

/*
==================================================
ESTRELAS CADENTES
==================================================
*/

function drawShootingStars(){

  for(let s of shootingStars){

    s.update();
    s.draw();

  }

}

/*
==================================================
LINHAS
==================================================
*/

function connectParticles(){

  for(let i=0;i<particles.length;i++){

    const a=particles[i];

    for(
      let j=i+1;
      j<i+4 && j<particles.length;
      j++
    ){

      const b=particles[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;

      const dist=
      Math.sqrt(dx*dx+dy*dy);

      if(dist<CONFIG.connectDistance){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);

        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle=
        "rgba(255,255,255,0.03)";

        ctx.lineWidth=0.35;

        ctx.stroke();

      }

    }

  }

}

/*
==================================================
ANIMAÇÃO
==================================================
*/

function animate(time=0){

  requestAnimationFrame(animate);

  ctx.clearRect(0,0,W,H);

  drawBackgroundStars();

  drawMovingStars(time);

  drawShootingStars();

  for(let p of particles){

    p.update();
    p.draw();

  }

  connectParticles();

}

animate();

/*
==================================================
RESIZE
==================================================
*/

addEventListener("resize",()=>{

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

});

</script>

</body>
</html>
